<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-calm" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="calm-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="20" fill="url(#bg-calm)"/>
  <circle cx="680" cy="120" r="160" fill="#10B981" fill-opacity="0.12" filter="blur(40px)"/>
  <circle cx="120" cy="380" r="160" fill="#34D399" fill-opacity="0.1" filter="blur(40px)"/>

  <!-- Window Frame -->
  <rect x="80" y="50" width="640" height="380" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="80" y="50" width="640" height="42" rx="16" fill="#1E293B"/>
  <rect x="80" y="78" width="640" height="14" fill="#1E293B"/>
  <circle cx="106" cy="71" r="5" fill="#EF4444"/>
  <circle cx="124" cy="71" r="5" fill="#F59E0B"/>
  <circle cx="142" cy="71" r="5" fill="#10B981"/>
  <text x="400" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CalmClove — Mental Wellness &amp; Telehealth PWA</text>

  <!-- Hero Banner inside app -->
  <rect x="110" y="105" width="580" height="120" rx="12" fill="#064E3B" stroke="#047857" stroke-width="1"/>
  <circle cx="160" cy="165" r="32" fill="#047857"/>
  <text x="160" y="173" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">🌿</text>
  <text x="210" y="150" fill="#ECFDF5" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Your Safe Space for Mental Wellness</text>
  <text x="210" y="175" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="11">Connect with licensed therapists, mindfulness guides, and community support.</text>
  <rect x="210" y="188" width="110" height="24" rx="12" fill="#10B981"/>
  <text x="265" y="204" fill="#064E3B" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Offline-First PWA</text>

  <!-- 3 Pillar Cards -->
  <rect x="110" y="240" width="180" height="165" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="145" cy="275" r="18" fill="#065F46"/>
  <text x="145" y="281" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">💬</text>
  <text x="175" y="280" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Therapist Chat</text>
  <text x="125" y="310" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">End-to-end private sessions with automated appointment scheduling.</text>
  <rect x="125" y="355" width="150" height="6" rx="3" fill="#334155"/>
  <rect x="125" y="355" width="110" height="6" rx="3" fill="#10B981"/>

  <rect x="310" y="240" width="180" height="165" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="345" cy="275" r="18" fill="#1E3A8A"/>
  <text x="345" y="281" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">🧘</text>
  <text x="375" y="280" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Daily Mind Track</text>
  <text x="325" y="310" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Guided journaling and mood trends tracking cached locally with Vite PWA.</text>
  <rect x="325" y="355" width="150" height="6" rx="3" fill="#334155"/>
  <rect x="325" y="355" width="130" height="6" rx="3" fill="#38BDF8"/>

  <rect x="510" y="240" width="180" height="165" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="545" cy="275" r="18" fill="#701A75"/>
  <text x="545" y="281" fill="#F472B6" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">🚀</text>
  <text x="575" y="280" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">AWS Scalability</text>
  <text x="525" y="310" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Ruby on Rails REST API, PostgreSQL database, 25% user engagement boost.</text>
  <rect x="525" y="355" width="150" height="6" rx="3" fill="#334155"/>
  <rect x="525" y="355" width="145" height="6" rx="3" fill="#C084FC"/>
</svg>