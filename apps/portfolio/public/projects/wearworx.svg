<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-wear" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="20" fill="url(#bg-wear)"/>
  <circle cx="700" cy="100" r="160" fill="#6366F1" fill-opacity="0.12" filter="blur(40px)"/>
  <circle cx="100" cy="400" r="160" fill="#818CF8" fill-opacity="0.1" filter="blur(40px)"/>

  <!-- Window Frame -->
  <rect x="80" y="50" width="640" height="380" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="80" y="50" width="640" height="42" rx="16" fill="#1E293B"/>
  <rect x="80" y="78" width="640" height="14" fill="#1E293B"/>
  <circle cx="106" cy="71" r="5" fill="#EF4444"/>
  <circle cx="124" cy="71" r="5" fill="#F59E0B"/>
  <circle cx="142" cy="71" r="5" fill="#10B981"/>
  <text x="400" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">WearWorx — MERN Fashion E-Commerce Platform</text>

  <!-- Store Hero -->
  <rect x="110" y="105" width="370" height="170" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="135" y="140" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">WearWorx Streetwear</text>
  <text x="135" y="162" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Discover urban fashion curated for comfort and edge.</text>
  <rect x="135" y="185" width="130" height="32" rx="6" fill="#4F46E5"/>
  <text x="200" y="205" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Shop Collection</text>
  <text x="135" y="250" fill="#818CF8" font-family="system-ui, sans-serif" font-size="10">⚡ JWT Authentication • Redux Cart</text>

  <!-- Redux State Cart Preview -->
  <rect x="500" y="105" width="190" height="170" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="595" y="135" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Redux Cart State</text>
  <rect x="520" y="150" width="150" height="30" rx="6" fill="#0F172A"/>
  <text x="530" y="170" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10">Urban Cargo Pant (1)</text>
  <rect x="520" y="190" width="150" height="30" rx="6" fill="#0F172A"/>
  <text x="530" y="210" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10">Oversize Jacket (1)</text>
  <text x="595" y="255" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Total: ₹4,199</text>

  <!-- MERN Stack Pillars -->
  <rect x="110" y="290" width="135" height="115" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="177" y="325" fill="#61DAFB" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">React</text>
  <text x="177" y="350" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Dynamic UI</text>
  <text x="177" y="375" fill="#818CF8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">SPA Routing</text>

  <rect x="260" y="290" width="135" height="115" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="327" y="325" fill="#22C55E" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Node / Express</text>
  <text x="327" y="350" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">RESTful API</text>
  <text x="327" y="375" fill="#818CF8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">JWT Security</text>

  <rect x="410" y="290" width="135" height="115" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="477" y="325" fill="#10B981" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MongoDB</text>
  <text x="477" y="350" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Product Catalog</text>
  <text x="477" y="375" fill="#818CF8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Mongoose Models</text>

  <rect x="560" y="290" width="130" height="115" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="625" y="325" fill="#A855F7" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Redux</text>
  <text x="625" y="350" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">State Management</text>
  <text x="625" y="375" fill="#818CF8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Persistent Cart</text>
</svg>