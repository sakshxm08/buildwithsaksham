<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-kindness" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4C0519"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="pink-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="20" fill="url(#bg-kindness)"/>
  <circle cx="680" cy="120" r="160" fill="#F43F5E" fill-opacity="0.12" filter="blur(40px)"/>
  <circle cx="120" cy="380" r="160" fill="#FB7185" fill-opacity="0.1" filter="blur(40px)"/>

  <!-- Window Frame -->
  <rect x="80" y="50" width="640" height="380" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="80" y="50" width="640" height="42" rx="16" fill="#1E293B"/>
  <rect x="80" y="78" width="640" height="14" fill="#1E293B"/>
  <circle cx="106" cy="71" r="5" fill="#EF4444"/>
  <circle cx="124" cy="71" r="5" fill="#F59E0B"/>
  <circle cx="142" cy="71" r="5" fill="#10B981"/>
  <text x="400" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ithinkyoua.re — Compliment &amp; Kindness Sharing App</text>

  <!-- Interactive Compliment Card -->
  <rect x="150" y="115" width="500" height="200" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <circle cx="400" cy="165" r="26" fill="url(#pink-accent)"/>
  <text x="400" y="173" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">❤️</text>
  <text x="400" y="220" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">&ldquo;I think you are genuinely extraordinary.&rdquo;</text>
  <text x="400" y="245" fill="#FDA4AF" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Sent with kindness to brighten someone&apos;s day</text>

  <rect x="310" y="265" width="180" height="34" rx="8" fill="url(#pink-accent)"/>
  <text x="400" y="286" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Amplify Kindness 💌</text>

  <!-- Bottom Metrics -->
  <rect x="150" y="335" width="150" height="70" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="225" y="362" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">+50%</text>
  <text x="225" y="385" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Mobile Interaction</text>

  <rect x="325" y="335" width="150" height="70" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="400" y="362" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">&lt;200ms</text>
  <text x="400" y="385" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Server Response Time</text>

  <rect x="500" y="335" width="150" height="70" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="575" y="362" fill="#10B981" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Cloudflare</text>
  <text x="575" y="385" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Edge Cache Network</text>
</svg>