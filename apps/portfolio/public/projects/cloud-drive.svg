<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-drive" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C4A6E"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="cyan-drive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="20" fill="url(#bg-drive)"/>
  <circle cx="680" cy="100" r="150" fill="#0EA5E9" fill-opacity="0.12" filter="blur(40px)"/>
  <circle cx="120" cy="380" r="160" fill="#38BDF8" fill-opacity="0.1" filter="blur(40px)"/>

  <!-- Window Frame -->
  <rect x="80" y="50" width="640" height="380" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="80" y="50" width="640" height="42" rx="16" fill="#1E293B"/>
  <rect x="80" y="78" width="640" height="14" fill="#1E293B"/>
  <circle cx="106" cy="71" r="5" fill="#EF4444"/>
  <circle cx="124" cy="71" r="5" fill="#F59E0B"/>
  <circle cx="142" cy="71" r="5" fill="#10B981"/>
  <text x="400" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cloud Drive — Self-Hosted Cloud Storage in Go</text>

  <!-- Search & Action Bar -->
  <rect x="110" y="105" width="580" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="130" y="130" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">🔍 Search files, folders, documents...</text>
  <rect x="580" y="112" width="100" height="26" rx="6" fill="url(#cyan-drive)"/>
  <text x="630" y="129" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+ Upload File</text>

  <!-- Left Sidebar / Drive navigation -->
  <rect x="110" y="160" width="160" height="250" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="130" y="190" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">📁 All Files</text>
  <text x="130" y="220" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">🕒 Recent</text>
  <text x="130" y="250" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">⭐ Starred</text>
  <text x="130" y="280" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">👥 Shared</text>
  <text x="130" y="310" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">🗑️ Trash</text>

  <rect x="125" y="350" width="130" height="45" rx="6" fill="#0F172A"/>
  <text x="135" y="368" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="10">Storage Used</text>
  <text x="135" y="385" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">42.8 GB / 1 TB</text>

  <!-- File Table / Explorer -->
  <rect x="285" y="160" width="405" height="250" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <!-- Row 1 -->
  <rect x="295" y="175" width="385" height="40" rx="6" fill="#0F172A"/>
  <text x="315" y="200" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11">📁 projects_backup_2026.tar.gz</text>
  <text x="560" y="200" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">1.4 GB</text>
  <text x="635" y="200" fill="#10B981" font-family="system-ui, sans-serif" font-size="10">Synced</text>

  <!-- Row 2 -->
  <rect x="295" y="225" width="385" height="40" rx="6" fill="#0F172A"/>
  <text x="315" y="250" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11">📄 system_architecture.pdf</text>
  <text x="560" y="250" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">4.2 MB</text>
  <text x="635" y="250" fill="#10B981" font-family="system-ui, sans-serif" font-size="10">Synced</text>

  <!-- Row 3 -->
  <rect x="295" y="275" width="385" height="40" rx="6" fill="#0F172A"/>
  <text x="315" y="300" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11">🖼️ brand_assets_highres.zip</text>
  <text x="560" y="300" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">210 MB</text>
  <text x="635" y="300" fill="#10B981" font-family="system-ui, sans-serif" font-size="10">Synced</text>

  <!-- Go & Docker badges -->
  <rect x="295" y="340" width="180" height="45" rx="6" fill="#0C4A6E"/>
  <text x="385" y="367" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Powered by Golang</text>

  <rect x="490" y="340" width="190" height="45" rx="6" fill="#0369A1"/>
  <text x="585" y="367" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Dockerized &amp; Cached</text>
</svg>