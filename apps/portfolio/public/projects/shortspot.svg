  <!-- Mini Bar Chart -->
  <rect x="135" y="340" width="22" height="50" rx="4" fill="#06B6D4"/>
  <rect x="175" y="325" width="22" height="65" rx="4" fill="#06B6D4"/>
  <rect x="215" y="310" width="22" height="80" rx="4" fill="#3B82F6"/>
  <rect x="255" y="330" width="22" height="60" rx="4" fill="#06B6D4"/>
  <rect x="295" y="300" width="22" height="90" rx="4" fill="#3B82F6"/>
  <rect x="335" y="315" width="22" height="75" rx="4" fill="#06B6D4"/>
  <rect x="375" y="290" width="22" height="100" rx="4" fill="url(#cyan-accent)"/>
  <rect x="415" y="305" width="22" height="85" rx="4" fill="#3B82F6"/>
