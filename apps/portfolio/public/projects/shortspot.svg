  <text x="130" y="222" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Original: https://github.com/sakshxm08...</text>
  <text x="130" y="242" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="10">⚡ 1,482 Clicks • Active</text>
  <rect x="380" y="195" width="85" height="32" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="422" y="215" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Copy Link</text>

  <!-- QR Code Card -->
  <rect x="500" y="175" width="190" height="235" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="595" y="202" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">QR Generator</text>
  <!-- Mock QR Grid -->
  <rect x="535" y="215" width="120" height="120" rx="8" fill="#FFFFFF"/>
  <rect x="547" y="227" width="28" height="28" fill="#0F172A"/>
  <rect x="551" y="231" width="20" height="20" fill="#FFFFFF"/>
  <rect x="555" y="235" width="12" height="12" fill="#0F172A"/>

  <rect x="615" y="227" width="28" height="28" fill="#0F172A"/>
  <rect x="619" y="231" width="20" height="20" fill="#FFFFFF"/>
  <rect x="623" y="235" width="12" height="12" fill="#0F172A"/>

  <rect x="547" y="295" width="28" height="28" fill="#0F172A"/>
  <rect x="551" y="299" width="20" height="20" fill="#FFFFFF"/>
  <rect x="555" y="303" width="12" height="12" fill="#0F172A"/>

  <rect x="585" y="240" width="10" height="20" fill="#0F172A"/>
  <rect x="590" y="275" width="20" height="10" fill="#0F172A"/>
  <rect x="620" y="270" width="15" height="15" fill="#0F172A"/>

  <rect x="535" y="350" width="120" height="28" rx="6" fill="url(#cyan-accent)"/>
  <text x="595" y="368" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Download SVG / PNG</text>

