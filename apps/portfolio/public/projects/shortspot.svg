<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-shortspot" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#134E4A"/>
    </linearGradient>
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="20" fill="url(#bg-shortspot)"/>
  <circle cx="700" cy="100" r="160" fill="#06B6D4" fill-opacity="0.12" filter="blur(40px)"/>
  <circle cx="100" cy="400" r="160" fill="#3B82F6" fill-opacity="0.1" filter="blur(40px)"/>

  <!-- Window Frame -->
  <rect x="80" y="50" width="640" height="380" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="80" y="50" width="640" height="42" rx="16" fill="#1E293B"/>
  <rect x="80" y="78" width="640" height="14" fill="#1E293B"/>
  <circle cx="106" cy="71" r="5" fill="#EF4444"/>
  <circle cx="124" cy="71" r="5" fill="#F59E0B"/>
  <circle cx="142" cy="71" r="5" fill="#10B981"/>
  <text x="400" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ShortSpot — Modern URL Shortener &amp; QR Analytics</text>

  <!-- URL Shorten Bar -->
  <rect x="110" y="110" width="580" height="52" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="130" y="141" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">https://github.com/sakshxm08/buildwithsaksham/tree/main/apps/shortspot</text>
  <rect x="580" y="118" width="100" height="36" rx="8" fill="url(#cyan-accent)"/>
  <text x="630" y="141" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Shorten Link</text>

  <!-- Shortened Result Card -->
  <rect x="110" y="175" width="370" height="80" rx="10" fill="#1E293B" stroke="#06B6D4" stroke-width="1"/>
